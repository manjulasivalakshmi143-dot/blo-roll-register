<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5A2DA3">
<meta name="description" content="Free register for Booth Level Officers: import the electoral roll, mark mobile, Aadhaar, ASD, slips and forms, compare each revision.">
<title>BLO Roll Register</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first register — sticky part header, one working panel, bottom tab bar. Violet = indelible-ink accent. */
:root{
  --paper:#F5F4F8; --surface:#FFFFFF; --ink:#1E1A2B; --muted:#686279; --line:#E1DEE9;
  --accent:#5A2DA3; --accent-ink:#FFFFFF; --accent-soft:#EEE7FA;
  --ok:#1D7349; --ok-soft:#E3F3EA; --warn:#9A5B00; --warn-soft:#FBF0DD; --bad:#B3261E; --bad-soft:#FBE6E4;
  --f-display:"Archivo","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans","Noto Sans Telugu",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121019; --surface:#1B1824; --ink:#ECE9F3; --muted:#A49EB6; --line:#2F2A3C;
  --accent:#B896F3; --accent-ink:#1A1030; --accent-soft:#2A2141;
  --ok:#62C893; --ok-soft:#173326; --warn:#E9AC4E; --warn-soft:#352813; --bad:#F28B82; --bad-soft:#3A1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121019; --surface:#1B1824; --ink:#ECE9F3; --muted:#A49EB6; --line:#2F2A3C;
  --accent:#B896F3; --accent-ink:#1A1030; --accent-soft:#2A2141;
  --ok:#62C893; --ok-soft:#173326; --warn:#E9AC4E; --warn-soft:#352813; --bad:#F28B82; --bad-soft:#3A1C1A; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) calc(28px + env(safe-area-inset-bottom,0px))}
:root{--rail:72px}
body.has-rail{padding-left:calc(var(--rail) + max(12px,env(safe-area-inset-left,0px)))}
@media (min-width:900px){:root{--rail:212px} .wrap{max-width:980px}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:750;font-stretch:88%}
h3{font-size:1rem;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:10px;height:30px;border-radius:5px 5px 8px 8px;background:linear-gradient(var(--accent),color-mix(in srgb,var(--accent) 60%,transparent));flex:none}
.brand h1{font-size:1.15rem;font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.04em}
.brand .sub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;flex:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block}
.sync[data-s="saved"] i{background:var(--ok)} .sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="error"] i{background:var(--bad)} .sync[data-s="local"] i{background:var(--warn)}

/* tabs */
/* navigation rail on the left: icons with labels on phones, a full sidebar on wide screens */
nav.tabs{position:fixed;left:0;top:0;bottom:0;width:calc(var(--rail) + env(safe-area-inset-left,0px));z-index:6;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:3px;padding:calc(64px + env(safe-area-inset-top,0px)) 6px calc(14px + env(safe-area-inset-bottom,0px)) calc(6px + env(safe-area-inset-left,0px));overflow-y:auto}
nav.tabs .rail-brand{display:none}
nav.tabs .rail-brand span{width:12px;height:34px;border-radius:6px 6px 9px 9px;background:linear-gradient(var(--accent),color-mix(in srgb,var(--accent) 55%,transparent))}
nav.tabs .rail-brand b{display:none}
nav.tabs button{position:relative;background:none;border:0;padding:8px 2px;border-radius:12px;font-size:.68rem;font-weight:650;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.15;transition:background .15s ease,color .15s ease}
nav.tabs button svg{width:24px;height:24px;flex:none}
nav.tabs button:hover{background:var(--paper);color:var(--ink)}
nav.tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs .add-tab{color:var(--accent);border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line))}
nav.tabs button[aria-current="true"]::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
@media (min-width:900px){
  nav.tabs{padding-inline:12px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;font-size:.92rem}
  nav.tabs button[aria-current="true"]::before{left:-12px}
}
@media (orientation:landscape) and (max-height:500px){ nav.tabs{gap:2px} nav.tabs button{padding:6px 2px} nav.tabs .rail-brand{display:none} }

/* generic */
.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:650;font-size:.9rem;box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 8%,transparent);transition:transform .08s ease,box-shadow .15s ease,background .15s ease}
.btn:hover{box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 18%,transparent)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.small-btn{padding:6px 12px;font-size:.8rem;border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea{font-size:.95rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.eyebrow{font-family:var(--f-display);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.note{font-size:.85rem;padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)} .note.ok{background:var(--ok-soft)}

/* home stats */
.bigline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bigline .n{font-family:var(--f-display);font-size:2.6rem;font-weight:800;font-stretch:80%;line-height:1;font-variant-numeric:tabular-nums}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .lbl{display:flex;justify-content:space-between;font-size:.85rem;gap:8px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.ok span{background:var(--ok)} .bar.warn span{background:var(--warn)}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.tally div{background:var(--surface);padding:8px 6px;text-align:center}
.tally b{display:block;font-family:var(--f-display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.tally small{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* list */
.toolbar{display:flex;flex-direction:column;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:4;background:var(--paper);padding-block:4px 8px}
.search{width:100%;font-size:1rem;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .c{font-family:var(--f-mono);font-weight:500;margin-left:4px;opacity:.8}
.selrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selrow select{padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;width:100%}
.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px 4px;font-family:var(--f-display);font-weight:700;font-size:.9rem;border-bottom:1px solid var(--line);margin-top:6px;gap:8px}
.group-h .mono{font-size:.8rem;color:var(--muted);font-weight:400}
.voters{display:flex;flex-direction:column}
.v{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.v:hover{background:var(--surface)}
.v .sl{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding:2px 8px 0 0;border-right:2px solid var(--line);text-align:right}
.v .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.v .nm small{font-weight:400;color:var(--muted);margin-left:6px}
.v .meta{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.v .meta .mono{color:var(--ink)}
.v.gone .nm{text-decoration:line-through;color:var(--muted)}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.pill{font-size:.68rem;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:4px;background:var(--line);color:var(--muted);text-transform:uppercase}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.more{margin:12px auto}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,8,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--paper);padding:7px 11px;font-size:.8rem;font-weight:650;color:var(--muted);border-radius:999px;white-space:nowrap;line-height:1.2}
.sheet>*{flex-shrink:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 1px 6px color-mix(in srgb,var(--accent) 35%,transparent)}
/* label-left detail grid */
.kv{display:grid;grid-template-columns:minmax(92px,30%) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.kv>.k,.kv>.val{padding:9px 10px;border-bottom:1px solid var(--line);min-width:0}
.kv>.k{background:var(--paper);color:var(--muted);font-size:.78rem;font-weight:650;border-right:1px solid var(--line);display:flex;align-items:flex-start;padding-top:12px}
.kv>.val{overflow-wrap:anywhere}
.kv>.k:nth-last-child(2),.kv>.val:last-child{border-bottom:0}
.kv input,.kv select,.kv textarea{width:100%;font-size:.95rem;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 9px;color:var(--ink)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-display);font-weight:750;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:4px}
.sheet-top{position:sticky;top:-16px;z-index:2;background:var(--surface);display:flex;flex-direction:column;gap:10px;padding-top:4px;padding-bottom:8px;margin-top:-4px;border-bottom:1px solid var(--line)}
.sheet-search{position:relative}
.sheet-search input{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:.92rem}
.sq-res{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,10,40,.18);max-height:50vh;overflow:auto;z-index:3}
.sq-res button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 10px;font-size:.85rem}
.sheet-bar{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px))}
.sheet-bar .grow{flex:1}
.sheet-bar .nav{min-width:84px}
.home-search{display:flex;gap:8px}
.stepper{display:flex;gap:4px;margin-top:6px}
.stepper i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.stepper i.done{background:var(--accent)}
.stepper.big{gap:6px}
.stepper.big span{flex:1;display:flex;flex-direction:column;gap:4px;font-size:.66rem;font-weight:650;color:var(--muted);text-align:center;line-height:1.15}
.stepper.big span.done{color:var(--accent)}
.stepper.big span i{height:6px;flex:none}
.stepper.big span.done i{background:var(--accent)}
.checklist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.chk{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.9rem;cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:20px;height:20px;accent-color:var(--accent);margin:1px 0 0}
.chk:has(input:checked){background:var(--ok-soft)}
.app-banner{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--accent-soft);width:100%;font:inherit;color:inherit;cursor:pointer}
.home-search input{flex:1;min-width:0;font-size:1rem;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.field-block{display:flex;flex-direction:column;gap:6px}
.field-block>span{font-size:.8rem;color:var(--muted);font-weight:500}

/* import */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface)}
.progress{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-height:60vh;overflow-y:auto}
table{border-collapse:collapse;font-size:.82rem;min-width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td input{border:1px solid transparent;background:transparent;padding:3px 4px;border-radius:4px;min-width:3ch;font-size:.82rem}
td input:focus{border-color:var(--accent);background:var(--paper)}
tr.flag td{background:var(--warn-soft)}
td,th{background:var(--surface)}
.tablewrap tr>*:nth-child(1){position:sticky;left:0;z-index:1}
.tablewrap tr>*:nth-child(2){position:sticky;left:var(--c1w,48px);z-index:1;border-right:2px solid var(--accent)}
.tablewrap th:nth-child(1),.tablewrap th:nth-child(2){z-index:2}
.diff-list{display:flex;flex-direction:column;gap:2px;max-height:40vh;overflow:auto}
.diff-list div{font-size:.85rem;padding:6px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:calc(50% + var(--rail)/2);transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:.85rem;z-index:30;max-width:90vw}
.empty{text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.steps{display:flex;flex-direction:column;gap:8px;text-align:left;max-width:420px;margin:0 auto}
.steps div{display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:.9rem}
.steps b{font-family:var(--f-display);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.auth{max-width:440px;margin:24px auto;display:flex;flex-direction:column;gap:14px}
.auth .card{display:flex;flex-direction:column;gap:12px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.auth-tabs button{border:0;background:var(--surface);padding:10px;font-weight:600;color:var(--muted)}
.auth-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.code{font-family:var(--f-mono);font-size:1.6rem;letter-spacing:.12em;text-align:center;padding:14px;border:2px dashed var(--accent);border-radius:10px;background:var(--accent-soft);user-select:all}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;text-align:left}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.ocrbox{font-family:var(--f-mono);font-size:.75rem;white-space:pre-wrap;max-height:160px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div style="min-width:0">
          <h1>BLO Roll Register</h1>
          <div class="sub" id="partLine">Your part's voter register</div>
        </div>
      </div>
      <span class="sync" id="sync" data-s="off"><i></i><span id="syncText">Starting…</span></span>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs" aria-label="Sections" hidden>
  <div class="rail-brand" aria-hidden="true"><span></span><b>BLO Register</b></div>
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
"use strict";
/* ================= config ================= */
const SB_URL = "https://rdtnikmsxyejimvudzvc.supabase.co";
const SB_KEY = "sb_publishable_Qy84k0vqQTGupexO6HHlQQ_cDqrgYc0";
const CH = 200;               // voters per saved block
const ASD = ["", "Absent", "Shifted", "Dead", "Duplicate"];
const FORMS = ["", "Form 6", "Form 7", "Form 8", "Form 6B"];

let session = null;           // {token, email} or {device:true}
let state = blank();
let tab = "home";
let listOpts = { q: "", filter: "all", group: "none", sort: "sl", shown: 150 };
let undoStack = [];
let staging = null;
let importJob = null;
let lastPrevRoll = null;

function blank(){ return { meta:{ ac:"", acName:"", part:"", partName:"", blo:"", rev:0, revisions:[], activity:[], lastBackup:0, createdAt:Date.now() }, voters:[], savedAt:0, cloudSavedAt:0 }; }
function defSt(){ return { mob:"", ph:"", aad:"", asd:"", slip:false, form:"", formDt:"", formSt:"", note:"" }; }
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normEpic = e => String(e||"").toUpperCase().replace(/[^A-Z0-9/]/g,"");
const uid8 = () => Math.random().toString(36).slice(2,10);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
function fmtDate(t){ if(!t) return "never"; const d=new Date(t); return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}); }
function daysAgo(t){ if(!t) return Infinity; return Math.floor((Date.now()-t)/86400000); }
function lsGet(k){ try{ const s=localStorage.getItem(k); return s?JSON.parse(s):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

/* ================= server ================= */
const MSG = { bad_email:"Enter a valid email address.", short_password:"Password must be at least 6 characters.", email_exists:"An account with this email already exists. Sign in instead.",
  wrong_login:"Email or password is wrong.", locked:"Too many wrong tries. Wait 15 minutes and try again.", not_signed_in:"You were signed out. Please sign in again." };
async function rpc(fn, args){
  const r = await fetch(SB_URL+"/rest/v1/rpc/"+fn, { method:"POST", headers:{ "apikey":SB_KEY, "Content-Type":"application/json" }, body:JSON.stringify(args) });
  const t = await r.text();
  if(!r.ok){ let m=""; try{ m=JSON.parse(t).message; }catch(e){} const err=new Error(MSG[m]||m||("Server error "+r.status)); err.code=m||"http"; throw err; }
  return t ? JSON.parse(t) : null;
}

/* ================= saving: phone copy + account copy ================= */
const cloud = { ready:false, dirty:new Set(), busy:false, again:false, timer:null };
function dataKey(){ return session && session.email ? "bloreg:data:"+session.email : "bloreg:data:device"; }
function setSync(s, text){ const el=$("#sync"); el.dataset.s=s; $("#syncText").textContent=text; }
function saveLocal(){ if(!lsSet(dataKey(), state)){ toast("Phone storage full — download an Excel backup now"); return false; } return true; }
function markDirty(idx){ if(idx!=null && idx<0) return; if(idx==null){ const n=Math.max(1,Math.ceil(state.voters.length/CH)); for(let i=0;i<n;i++) cloud.dirty.add(i); } else cloud.dirty.add(Math.floor(idx/CH)); }

function commit(label, idx, activity){
  state.savedAt = Date.now();
  if(activity){ state.meta.activity.unshift({t:state.savedAt, a:activity}); state.meta.activity = state.meta.activity.slice(0,150); }
  markDirty(idx); saveLocal(); scheduleCloud(); updateHeader();
}
function pushUndo(label){ undoStack.push({label, data:JSON.stringify({meta:state.meta, voters:state.voters})}); if(undoStack.length>15) undoStack.shift(); }
function undo(){ const u=undoStack.pop(); if(!u) return; const d=JSON.parse(u.data); state.meta=d.meta; state.voters=d.voters; commit("undo", null, "Undid: "+u.label); render(); toast("Undone: "+u.label); }

function scheduleCloud(){
  if(session && session.device){ setSync("local","Saved on this phone"); return; }
  if(!cloud.ready){ setSync("local","Saved on phone"); return; }
  setSync("saving","Saving…");
  clearTimeout(cloud.timer); cloud.timer=setTimeout(flushCloud, 1200);
}
async function flushCloud(){
  if(!cloud.ready) return;
  if(cloud.busy){ cloud.again=true; return; }
  cloud.busy=true;
  const todo=[...cloud.dirty].sort((a,b)=>a-b); cloud.dirty.clear();
  const n=Math.max(1,Math.ceil(state.voters.length/CH)); const stamp=state.savedAt;
  try{
    for(const i of todo){ if(i<n) await rpc("blo_save_chunk",{ p_token:session.token, p_idx:i, p_v:{ v: state.voters.slice(i*CH,(i+1)*CH) } }); }
    await rpc("blo_save_meta",{ p_token:session.token, p_meta:state.meta, p_chunks:n, p_saved_at:stamp });
    state.cloudSavedAt=stamp; saveLocal(); setSync("saved","Saved to account");
  }catch(e){
    todo.forEach(i=>cloud.dirty.add(i));
    if(e.code==="not_signed_in"){ setSync("error","Signed out · saved on phone"); cloud.ready=false; toast(e.message); }
    else { setSync("error", navigator.onLine===false ? "Offline · saved on phone" : "Saved on phone · retrying"); setTimeout(scheduleCloud, 15000); }
  }finally{
    cloud.busy=false; if(cloud.again){ cloud.again=false; scheduleCloud(); }
  }
}
window.addEventListener("online", ()=>{ if(cloud.ready && cloud.dirty.size) scheduleCloud(); else if(session && session.token && !cloud.ready) connectAccount(); });

function adoptPending(){
  // phone-only data waiting to go into a newly signed-in account
  const pending=lsGet("bloreg:pending-upload");
  if(!(session && session.token && pending && pending.voters && pending.voters.length)) return;
  const mine=lsGet("bloreg:data:"+session.email);
  if(!mine || !mine.voters || !mine.voters.length){ pending.savedAt=Date.now(); pending.cloudSavedAt=0; lsSet("bloreg:data:"+session.email, pending); }
  try{ localStorage.removeItem("bloreg:pending-upload"); }catch(e){}
}
async function connectAccount(){
  adoptPending();
  const local = lsGet(dataKey());
  if(local && local.meta && Array.isArray(local.voters)){ state=Object.assign(blank(),local); state.meta=Object.assign(blank().meta,local.meta); }
  showApp();
  setSync("saving","Loading account…");
  try{
    const r = await rpc("blo_load",{ p_token:session.token });
    if(r.exists && (r.saved_at||0) >= (state.savedAt||0)){
      if(state.savedAt > (state.cloudSavedAt||0)) lsSet("bloreg:older-phone-copy:"+session.email, state);
      const voters=[]; for(const c of r.chunks) voters.push(...((c&&c.v)||[]));
      state = { meta:Object.assign(blank().meta, r.meta||{}), voters, savedAt:r.saved_at||0, cloudSavedAt:r.saved_at||0 };
      saveLocal(); cloud.ready=true; setSync("saved","Saved to account"); render(); syncLists();
    } else {
      cloud.ready=true; syncLists();
      if(state.voters.length || state.meta.part){ markDirty(null); scheduleCloud(); } else setSync("saved","Account ready");
    }
  }catch(e){
    if(e.code==="not_signed_in"){ lsSet("bloreg:session", null); session=null; toast(e.message); showAuth(); return; }
    setSync("error","Offline · saved on phone");
    setTimeout(()=>{ if(!cloud.ready && session && session.token) connectAccount(); }, 20000);
  }
}

/* ================= sign in / sign up ================= */
function showAuth(mode){
  mode = mode || "login";
  $("#tabs").hidden=true; document.body.classList.remove("has-rail");
  setSync("off","Not signed in");
  $("#partLine").textContent="Your part's voter register";
  const v=$("#view");
  if(mode==="recovery"){ return; }
  v.innerHTML=`<div class="auth">
    <div><h2>Keep your part's roll safe</h2><p class="muted small" style="margin:6px 0 0">Free for every BLO. Sign in with your email so your voter list is saved to your own private account and comes back on any phone.</p></div>
    <div class="auth-tabs"><button data-m="login" aria-pressed="${mode==="login"}">Sign in</button><button data-m="signup" aria-pressed="${mode==="signup"}">Create account</button></div>
    <form class="card" id="authForm" novalidate>
      <label class="f">Email (your Gmail)<input id="aEmail" type="email" autocomplete="username" inputmode="email" required></label>
      ${mode==="reset"?`<label class="f">Recovery code<input id="aRc" class="mono" autocomplete="off" required></label>`:""}
      <label class="f">${mode==="reset"?"New password":"Password"}<input id="aPass" type="password" autocomplete="${mode==="login"?"current-password":"new-password"}" minlength="6" required></label>
      ${mode!=="login"?`<label class="f">Type the password again<input id="aPass2" type="password" autocomplete="new-password" required></label>`:""}
      <div class="err" id="aErr" role="alert"></div>
      <button class="btn primary" type="submit">${mode==="login"?"Sign in":mode==="signup"?"Create my account":"Set new password"}</button>
      ${mode==="login"?`<button type="button" class="linkbtn" id="forgot">Forgot password?</button>`:""}
      ${mode==="reset"?`<button type="button" class="linkbtn" id="backLogin">Back to sign in</button>`:""}
    </form>
    ${installCard()}
    <div class="card small"><strong>No internet or no account?</strong><span class="muted">You can also use the app on this phone only. Your data stays on this phone; download Excel backups often.</span><button class="btn" id="deviceMode">Use on this phone only</button></div>
  </div>`;
  v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>showAuth(b.dataset.m));
  if($("#forgot")) $("#forgot").onclick=()=>showAuth("reset");
  if($("#backLogin")) $("#backLogin").onclick=()=>showAuth("login");
  bindInstall();
  $("#deviceMode").onclick=()=>{ session={device:true}; lsSet("bloreg:session", session); startData(); };
  $("#authForm").onsubmit=async e=>{
    e.preventDefault();
    const email=$("#aEmail").value.trim(), pass=$("#aPass").value, err=$("#aErr");
    err.textContent="";
    if(mode!=="login" && pass!==$("#aPass2").value){ err.textContent="The two passwords don't match."; return; }
    const btn=e.submitter||$("#authForm button[type=submit]"); btn.disabled=true; btn.textContent="Please wait…";
    try{
      let r;
      if(mode==="login") r=await rpc("blo_login",{p_email:email,p_pass:pass});
      else if(mode==="signup") r=await rpc("blo_signup",{p_email:email,p_pass:pass});
      else r=await rpc("blo_reset",{p_email:email,p_recovery:$("#aRc").value,p_new:pass});
      session={token:r.token,email:r.email}; lsSet("bloreg:session", session);
      if(r.recovery) showRecovery(r.recovery); else connectAccount();
    }catch(ex){ err.textContent = ex.code==="http"||!ex.code ? "Can't reach the server. Check internet and try again." : ex.message; btn.disabled=false; btn.textContent=mode==="login"?"Sign in":mode==="signup"?"Create my account":"Set new password"; }
  };
}
function showRecovery(code){
  $("#view").innerHTML=`<div class="auth"><div class="card">
    <h2>Write down your recovery code</h2>
    <p class="muted small" style="margin:0">If you forget your password, this code is the only way back into your account. Write it in your diary or take a photo. Nobody else can reset it for you.</p>
    <div class="code" id="rcode">${esc(code)}</div>
    <button class="btn" id="cp">Copy code</button>
    <label class="row small"><input type="checkbox" id="rcOk"> I have written it down</label>
    <button class="btn primary" id="rcGo" disabled>Continue</button>
  </div></div>`;
  $("#cp").onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast("Copied"); }catch(e){ const r=document.createRange(); r.selectNodeContents($("#rcode")); getSelection().removeAllRanges(); getSelection().addRange(r); } };
  $("#rcOk").onchange=e=>$("#rcGo").disabled=!e.target.checked;
  $("#rcGo").onclick=()=>connectAccount();
}
function startData(){
  if(session && session.token){ connectAccount(); return; }
  const local=lsGet(dataKey()); if(local && local.meta){ state=Object.assign(blank(),local); state.meta=Object.assign(blank().meta,local.meta); }
  showApp(); setSync("local", "Saved on this phone");
}
function showApp(){ $("#tabs").hidden=false; document.body.classList.add("has-rail"); render(); }
async function signOut(){
  if(cloud.ready && (cloud.dirty.size || cloud.busy)){ toast("Still saving — try again in a moment"); return; }
  try{ if(session && session.token) await rpc("blo_logout",{p_token:session.token}); }catch(e){}
  session=null; lsSet("bloreg:session", null); cloud.ready=false; state=blank(); undoStack=[]; staging=null; showAuth();
}

/* ================= stats ================= */
function live(){ return state.voters.filter(v=>!v.gone && !v.st.del); }
function stats(){
  const L=live(), n=L.length, c=f=>L.filter(f).length;
  return { n, m:c(v=>v.gender==="M"), f:c(v=>v.gender==="F"), t:c(v=>v.gender==="T"),
    mob:c(v=>v.st.mob==="yes"), aad:c(v=>v.st.aad==="yes"), asd:c(v=>asdOf(v)), slip:c(v=>v.st.slip),
    forms:c(v=>v.st.form && v.st.formSt!=="Approved" && v.st.formSt!=="Rejected"),
    nophoto:c(v=>v.photo==="no"), photoKnown:c(v=>v.photo==="yes"||v.photo==="no"),
    newRev:c(v=>v.newIn && v.newIn===state.meta.rev && state.meta.rev>1), manual:c(v=>v.src==="manual") };
}
function updateHeader(){
  const m=state.meta, bits=[];
  if(m.ac||m.acName) bits.push("AC "+[m.ac,m.acName].filter(Boolean).join("-"));
  if(m.part) bits.push("Part "+m.part+(m.partName?" · "+m.partName:""));
  $("#partLine").textContent = bits.length? bits.join(" · ") : (state.voters.length? state.voters.length+" voters" : "No roll loaded yet");
}
function vIndex(id){ return state.voters.findIndex(v=>v.id===id); }

/* ================= render ================= */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===tab));
  ({home:renderHome, voters:renderVoters, apps:renderApps, lists:renderLists, asd:renderAsd, import:renderImport, revisions:renderRevisions, backup:renderBackup})[tab]($("#view"));
  updateHeader();
}
document.getElementById("tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; if(b.dataset.action==="add"){ openVoter(null); return; } if(b.dataset.tab==="lists") window._openList=null; tab=b.dataset.tab; render(); window.scrollTo(0,0); });

function meterRow(label, n, total, cls){
  const p= total? Math.round(n*100/total):0;
  return `<div class="meter"><div class="lbl"><span>${label}</span><span class="mono">${n} / ${total} · ${p}%</span></div><div class="bar ${cls||""}"><span style="width:${p}%"></span></div></div>`;
}

    ${m.demo?`<div class="note warn">You are looking at <strong>example data</strong>. Clear it in Account → Start fresh before importing your real roll.</div>`:""}

    <div class="card panel">

    <div class="card panel">
      <div class="row" style="justify-content:space-between"><h3>Work going on now</h3></div>

    <div class="card panel">
      <h3>Quick lists</h3>

  el.insertAdjacentHTML("beforeend", installCard() ? `<div style="margin-top:14px">${installCard()}</div>` : ""); bindInstall();

  if($("#undoBtn")) $("#undoBtn").onclick=undo;
  if($("#bkNow")) $("#bkNow").onclick=exportExcel;
  bindSettings();
}
function settingsCard(){

/* ---------- saved lists: every roll kept by name (2025, 2026, draft, final…) ---------- */
const LIST_TYPES=["Draft roll","Final roll","Supplementary","Other"];
function listsMeta(){ if(!Array.isArray(state.meta.lists)) state.meta.lists=[]; return state.meta.lists; }
function listKey(id){ return "bloreg:list:"+((session&&session.email)||"device")+":"+id; }
function guessList(src){
  src=String(src||""); const y=(src.match(/20\d\d/)||[String(new Date().getFullYear())])[0];
  const type=/draft/i.test(src)?"Draft roll":/final/i.test(src)?"Final roll":/supp/i.test(src)?"Supplementary":"Other";
  const kind=/\bSIR\b|-SIR-/i.test(src)?"SIR ":/SSR|summary/i.test(src)?"SSR ":"";
  return { name:`${y} ${kind}${type==="Other"?"roll":type.toLowerCase()}`.replace(/\s+/g," ").trim(), type, year:y };
}
function cleanListRows(rows){ return rows.map(r=>{ const o={}; for(const k of ["sl","epic","name","nameEn","relType","relName","relNameEn","house","age","gender","sec","photo"]) if(r[k]) o[k]=r[k]; return o; }); }
function keepStagingAsList(){
  const S=staging; if(!S||!S.rows||!S.rows.length||S.fromList) return;
  const n=$("#lName"), t=$("#lType"), y=$("#lYear");
  if(n){ S.listName=n.value.trim(); S.listType=t.value; S.listYear=y.value.trim(); }
  if(S.listName==null){ const g=guessList(S.source); S.listName=g.name; S.listType=g.type; S.listYear=g.year; }
  saveList({ id:"L"+Date.now().toString(36)+uid8().slice(0,4), name:S.listName||S.source||"Roll", type:S.listType||"Other", year:S.listYear||"", source:S.source }, cleanListRows(S.rows));
}
function saveList(meta, rows){
  meta.count=rows.length; meta.at=Date.now(); meta.synced=false;
  if(!lsSet(listKey(meta.id), rows)) toast("Phone storage is full — the list is kept in your account only");
  const L=listsMeta(); const i=L.findIndex(x=>x.id===meta.id); if(i>=0) L[i]=meta; else L.unshift(meta);
  commit("list",-1,"Saved list: "+meta.name+" ("+rows.length+" voters)");
  uploadList(meta.id, rows);
}
async function uploadList(id, rows){
  if(!(session&&session.token)) return;
  const m=listsMeta().find(x=>x.id===id); rows=rows||lsGet(listKey(id)); if(!m||!rows) return;
  try{
    const n=Math.max(1,Math.ceil(rows.length/CH));
    for(let i=0;i<n;i++) await rpc("blo_save_list_chunk",{p_token:session.token,p_list:id,p_idx:i,p_v:{v:rows.slice(i*CH,(i+1)*CH)}});
    await rpc("blo_trim_list",{p_token:session.token,p_list:id,p_chunks:n});
    m.synced=true; commit("list-sync",-1);
  }catch(e){ /* stays on the phone; tried again on next sign-in */ }
}
function syncLists(){ for(const m of listsMeta()) if(!m.synced) uploadList(m.id); }
async function getListRows(id){
  let rows=lsGet(listKey(id)); if(rows) return rows;
  if(session&&session.token){ const r=await rpc("blo_load_list",{p_token:session.token,p_list:id}); rows=[]; for(const c of (r||[])) rows.push(...((c&&c.v)||[])); if(rows.length){ lsSet(listKey(id),rows); return rows; } }
  return null;
}
async function deleteList(id){
  const L=listsMeta(), i=L.findIndex(x=>x.id===id); if(i<0) return;
  const m=L[i]; L.splice(i,1); try{ localStorage.removeItem(listKey(id)); }catch(e){}
  commit("list",-1,"Deleted list: "+m.name);
  if(session&&session.token){ try{ await rpc("blo_trim_list",{p_token:session.token,p_list:id,p_chunks:0}); }catch(e){} }
}

function asdNormCat(c){ c=String(c||"").trim().toLowerCase(); if(!c) return "";

  if(/^d$|^e$|dead|death|expired|died|మరణ|చనిపో/.test(c)) return "Dead";
  if(/^r$|repeat|dupl|double|నకిలీ/.test(c)) return "Duplicate";

function asdIndex(){

  if(_asdIdx && _asdKey===key) return _asdIdx;

function readAsdSheet(file){
  if(typeof XLSX==="undefined"){ toast("Excel reader didn't load. Check internet and reopen."); return; }
  const r=new FileReader();
  r.onload=()=>{ try{
    const wb=XLSX.read(new Uint8Array(r.result),{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    let hi=rows.findIndex(rw=>rw.filter(c=>String(c).trim()&&isNaN(c)).length>=2); if(hi<0) hi=0;
    const head=rows[hi].map(h=>String(h).trim()), map={};
    for(const [k,,syn] of ASD_FIELDS){ map[k]=head.findIndex((h,ix)=>!Object.values(map).includes(ix) && syn.some(s=>h.toLowerCase().includes(s))); }
    window._asdStage={ head, body:rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim())), map, source:file.name };
    render();
  }catch(e){ toast("Couldn't read that file"); } };
  r.readAsArrayBuffer(file);
}

function cmp(a,b){ return a<b?-1:a>b?1:0; }
function sorted(list){
  const by = {
    sl:(a,b)=>(+a.sl||1e9)-(+b.sl||1e9),
    name:(a,b)=>cmp((a.nameEn||a.name).toLowerCase(),(b.nameEn||b.name).toLowerCase()),
    house:(a,b)=>{ const x=houseKey(a.house), y=houseKey(b.house); return x[0]-y[0]||cmp(x[1],y[1])||(+a.sl||0)-(+b.sl||0); },
    age:(a,b)=>(+a.age||0)-(+b.age||0), ageD:(a,b)=>(+b.age||0)-(+a.age||0),
  }[listOpts.sort];
  return list.slice().sort(by);
}
function groupOf(v){
  switch(listOpts.group){
    case "house": return "House "+(v.house||"—");
    case "section": return v.sec||"No section";
    case "gender": return {M:"Male",F:"Female",T:"Third gender"}[v.gender]||"Not marked";
    case "age": { const a=+v.age; if(!a) return "Age unknown"; if(a<=19) return "18–19"; if(a<30) return "20–29"; if(a<40) return "30–39"; if(a<50) return "40–49"; if(a<60) return "50–59"; if(a<80) return "60–79"; return "80+"; }
    case "family": return (v.relNameEn||v.relName||"—")+" · H "+(v.house||"—");
    default: return null;
  }
}
function matchQ(v,q){ if(!q) return true; return [v.name,v.nameEn,v.relName,v.relNameEn,v.house,v.epic,v.sl,v.st.ph,v.sec,v.st.note].some(x=>String(x||"").toLowerCase().includes(q)); }
function renderVoters(el){
  if(!state.voters.length){ el.innerHTML=`<div class="card empty"><h2>No voters yet</h2><p class="muted small">Import your roll first.</p><button class="btn primary" id="gi">Import roll</button></div>`; $("#gi").onclick=()=>{tab="import";render();}; return; }
  const counts = Object.fromEntries(FILTERS.map(([k,,f])=>[k,state.voters.filter(f).length]));
  el.innerHTML = `<div class="toolbar">
      <input class="search" id="q" type="search" placeholder="Search name, EPIC, house, mobile…" value="${esc(listOpts.q)}" aria-label="Search voters">
      <div class="chips" id="chips">${FILTERS.filter(f=>!f[3]||f[3].includes(mode())||listOpts.filter===f[0]).map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${listOpts.filter===k}">${l}<span class="c">${counts[k]}</span></button>`).join("")}</div>
      <div class="selrow">
        <select id="grp" aria-label="Group by">${[["none","No grouping"],["house","Group: house no."],["family","Group: family"],["section","Group: section"],["gender","Group: gender"],["age","Group: age band"]].map(([v,l])=>`<option value="${v}" ${listOpts.group===v?"selected":""}>${l}</option>`).join("")}</select>
        <select id="srt" aria-label="Sort by">${[["sl","Sort: serial no."],["name","Sort: name"],["house","Sort: house no."],["age","Sort: age ↑"],["ageD","Sort: age ↓"]].map(([v,l])=>`<option value="${v}" ${listOpts.sort===v?"selected":""}>${l}</option>`).join("")}</select>
      </div>
    </div><div id="list"></div>`;
  $("#q").addEventListener("input", e=>{ listOpts.q=e.target.value; listOpts.shown=150; drawList(); });
  $("#chips").onclick=e=>{ const b=e.target.closest(".chip"); if(!b) return; listOpts.filter=b.dataset.k; listOpts.shown=150; el.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b)); drawList(); };
  $("#grp").onchange=e=>{ listOpts.group=e.target.value; drawList(); };
  $("#srt").onchange=e=>{ listOpts.sort=e.target.value; drawList(); };
  drawList();
}
function pillsFor(v){
  const p=[];
  if(v.gone) p.push(`<span class="pill bad">Removed rev ${v.goneRev||""}</span>`);
  if(v.st.del) p.push(`<span class="pill bad">Deleted by me</span>`);
  const md=mode();
  if(md!=="election"){ p.push(v.st.mob==="yes"?`<span class="pill ok">Mobile ✓</span>`:`<span class="pill">Mobile</span>`);
    p.push(v.st.aad==="yes"?`<span class="pill ok">Aadhaar ✓</span>`:`<span class="pill">Aadhaar</span>`); }
  if(asdOf(v) && md!=="normal") p.push(`<span class="pill warn">${esc(asdOf(v))}${asdEntry(v)&&!v.st.asd?" · list":""}</span>`);
  if(v.photo==="no") p.push(`<span class="pill bad">No photo</span>`);
  if(v.corr&&v.corr.length&&!v.corrDone) p.push(`<span class="pill warn">Corrected by me</span>`);
  if(v.photoIn && v.photoIn===state.meta.rev) p.push(`<span class="pill ok">Photo added</span>`);
  if(v.st.slip && md==="election") p.push(`<span class="pill acc">Slip given</span>`);
  if(v.st.form && md==="revision") p.push(`<span class="pill acc">${esc(v.st.form)}${v.st.formSt?" · "+esc(v.st.formSt):""}</span>`);
  if(v.src==="manual") p.push(`<span class="pill warn">Added by me</span>`);
  if(v.newIn && v.newIn===state.meta.rev && state.meta.rev>1) p.push(`<span class="pill acc">New</span>`);
  if(v.chgIn && v.chgIn===state.meta.rev) p.push(`<span class="pill acc">Corrected</span>`);
  return p.join("");
}
function voterRow(v){
  const rel = v.relName||v.relNameEn ? `${esc(v.relType||"Rel")}: ${esc(v.relName||v.relNameEn)}` : "";
  return `<button class="v ${v.gone||v.st.del?"gone":""}" data-id="${esc(v.id)}">
    <span class="sl">${esc(v.sl||"—")}</span>
    <span style="min-width:0">
      <div class="nm">${esc(v.name||v.nameEn||"(no name)")}${v.nameEn&&v.name&&v.nameEn!==v.name?`<small>${esc(v.nameEn)}</small>`:""}</div>
      <div class="meta">${rel}${rel?" · ":""}H <span class="mono">${esc(v.house||"—")}</span> · ${esc(v.age||"?")}${esc(v.gender||"")} · <span class="mono">${esc(v.epic||"no EPIC")}</span></div>
      <div class="pills">${pillsFor(v)}</div>
    </span></button>`;
}
function drawList(){
  const f=FILTERS.find(x=>x[0]===listOpts.filter)[2], q=listOpts.q.trim().toLowerCase();
  const list=sorted(state.voters.filter(v=>f(v)&&matchQ(v,q))), total=list.length;
  window._listIds=list.map(v=>v.id);
  const box=$("#list"); if(!box) return;
  let html=`<div class="muted small" style="padding:4px 2px">${total} voter${total===1?"":"s"}</div>`;
  if(listOpts.group!=="none"){
    const groups=new Map(); for(const v of list){ const g=groupOf(v); if(!groups.has(g)) groups.set(g,[]); groups.get(g).push(v); }
    let shown=0;
    for(const [g,vs] of groups){ if(shown>=listOpts.shown) break; const part=vs.slice(0,listOpts.shown-shown); shown+=part.length;
      html+=`<div class="group-h"><span>${esc(g)}</span><span class="mono">${vs.length}</span></div><div class="voters">${part.map(voterRow).join("")}</div>`; }
  } else html+=`<div class="voters">${list.slice(0,listOpts.shown).map(voterRow).join("")}</div>`;
  if(total>listOpts.shown) html+=`<button class="btn block more" id="more">Show more (${total-listOpts.shown} left)</button>`;
  box.innerHTML=html;
  box.onclick=e=>{ const b=e.target.closest(".v"); if(b){ if(listOpts.group!=="none") window._listIds=[...box.querySelectorAll(".v")].map(x=>x.dataset.id); openVoter(b.dataset.id); } if(e.target.id==="more"){ listOpts.shown+=300; drawList(); } };
}

/* ================= Telugu → English letters (for search) ================= */
const TV={"అ":"a","ఆ":"a","ఇ":"i","ఈ":"i","ఉ":"u","ఊ":"u","ఋ":"ru","ఎ":"e","ఏ":"e","ఐ":"ai","ఒ":"o","ఓ":"o","ఔ":"au"};
const TC={"క":"k","ఖ":"kh","గ":"g","ఘ":"gh","ఙ":"n","చ":"ch","ఛ":"chh","జ":"j","ఝ":"jh","ఞ":"n","ట":"t","ఠ":"th","డ":"d","ఢ":"dh","ణ":"n","త":"t","థ":"th","ద":"d","ధ":"dh","న":"n","ప":"p","ఫ":"ph","బ":"b","భ":"bh","మ":"m","య":"y","ర":"r","ఱ":"r","ల":"l","ళ":"l","వ":"v","శ":"s","ష":"sh","స":"s","హ":"h"};
const TM={"ా":"a","ి":"i","ీ":"i","ు":"u","ూ":"u","ృ":"ru","ె":"e","ే":"e","ై":"ai","ొ":"o","ో":"o","ౌ":"au"};
function translit(s){
  s=String(s||""); let o="";
  for(let i=0;i<s.length;i++){
    const ch=s[i], nx=s[i+1];
    if(TC[ch]){ o+=TC[ch]; if(TM[nx]){ o+=TM[nx]; i++; } else if(nx==="్"){ i++; } else o+="a"; }
    else if(TV[ch]) o+=TV[ch];
    else if(ch==="ం") o+= (TC[nx]&&!"పబమ".includes(nx))?"n":"m";
    else if(ch==="ః") o+="h";
    else if(ch==="‌"||ch==="‍"||TM[ch]||ch==="్") {}
    else o+=ch;
  }
  return o.replace(/ayi\b/g,"ai").replace(/\b[a-z]/g,c=>c.toUpperCase()).replace(/\s+/g," ").trim();
}

async function handleFiles(files){

const FIELDS = [

  ["nameEn","Name (English)",["english","name_en","name en"]],
  ["relType","Relation type",["relation type","rel type","relationtype"]],
  ["relName","Relation name",["father","husband","relation","relative","guardian"]],
  ["house","House no.",["house","door","h.no","hno","ఇంటి"]],
  ["age","Age",["age","వయస్సు"]],
  ["gender","Gender",["gender","sex","లింగ"]],

function readSheet(file){
  if(typeof XLSX==="undefined"){ toast("Excel reader didn't load. Check internet and reopen."); return; }
  const r=new FileReader();
  r.onload=()=>{
    try{
      const wb=XLSX.read(new Uint8Array(r.result),{type:"array"});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
      let hi=rows.findIndex(rw=>rw.filter(c=>String(c).trim()&&isNaN(c)).length>=3); if(hi<0) hi=0;
      const head=rows[hi].map(h=>String(h).trim()), map={};
      for(const [k,,syn] of FIELDS){ map[k]=head.findIndex((h,ix)=>!Object.values(map).includes(ix) && syn.some(s=>h.toLowerCase().includes(s))); }
      if(map.nameEn===map.name) map.nameEn=-1;
      drawMapping(head, rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim())), map, file.name);
    }catch(e){ toast("Couldn't read that file"); }
  };
  r.readAsArrayBuffer(file);
}
function drawMapping(head, body, map, fname){
  const el=$("#view");
  el.innerHTML=`<div class="panel"><h2>Match the columns</h2><p class="muted small" style="margin:0">${esc(fname)} · ${body.length} rows. Check that each field points to the right column.</p>
    <div class="grid2">${FIELDS.map(([k,l])=>`<label class="f">${l}<select data-k="${k}"><option value="-1">— not in file —</option>${head.map((h,i)=>`<option value="${i}" ${map[k]===i?"selected":""}>${esc(h||"Column "+(i+1))}</option>`).join("")}</select></label>`).join("")}</div>
    <div class="row"><button class="btn primary" id="mapGo">Continue</button><button class="btn" id="mapX">Cancel</button></div></div>`;
  $("#mapX").onclick=()=>render();
  $("#mapGo").onclick=()=>{
    el.querySelectorAll("select[data-k]").forEach(s=>map[s.dataset.k]=+s.value);
    if(map.name<0 && map.nameEn<0){ toast("Pick the Name column"); return; }
    const g=(r,k)=> map[k]>=0? String(r[map[k]]??"").trim() : "";
    const rows=body.map(r=>mkRow({ sl:g(r,"sl"), epic:g(r,"epic"), name:g(r,"name"), nameEn:g(r,"nameEn"), relType:g(r,"relType"), relName:g(r,"relName"), house:g(r,"house"), age:g(r,"age"), gender:g(r,"gender"), sec:g(r,"sec"), ph:g(r,"ph"), photo:g(r,"photo") }));

}
function normGender(g){ g=String(g||"").trim(); const u=g.toUpperCase();
  if(/FEMALE|స్త్రీ|స్ర్తీ|महिला|^F$|^W$/.test(u)) return "F";
  if(/THIRD|ఇతర|TRANS|^T$|^TG$|^O$/.test(u)) return "T";
  if(/MALE|పురుష|पुरुष|^M$/.test(u)) return "M"; return ""; }
function normRel(r){ r=String(r||"").toLowerCase(); if(/husb|భర్త|पति/.test(r)) return "Husband"; if(/moth|తల్లి|माता/.test(r)) return "Mother"; if(/fath|తండ్రి|पिता/.test(r)) return "Father"; return r? "Other":""; }

let ocrWorker=null, ocrLang=null;
async function getOcr(lang, onStatus){
  if(ocrWorker && ocrLang===lang) return ocrWorker;
  if(ocrWorker){ try{ await ocrWorker.terminate(); }catch(e){} ocrWorker=null; }
  if(typeof Tesseract==="undefined") throw new Error("The reading engine didn't load. Check internet and reopen the page.");
  ocrWorker = await Tesseract.createWorker(lang, 1, { logger: m=>{ if(onStatus && m.status) onStatus(m); } }); ocrPsm=null;
  ocrLang=lang; return ocrWorker;
}
async function readPdf(file){

  let pdf;

    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
  }catch(e){ toast("Couldn't open that PDF. If it has a password, remove it first."); return; }

function readImages(files){ startJob({ pages:files.map((f,i)=>({kind:"img", n:i+1, file:f})), source:files.length+" photo(s)" }); }

async function renderPage(job,p){
  const canvas=document.createElement("canvas"), ctx=canvas.getContext("2d",{willReadFrequently:true});
  let words=null;
  if(p.kind==="pdf"){
    const page=await job.pdf.getPage(p.n), base=page.getViewport({scale:1}), vp=page.getViewport({scale:Math.min(2.5, 2400/base.width)});
    canvas.width=Math.floor(vp.width); canvas.height=Math.floor(vp.height);
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
    await page.render({canvasContext:ctx, viewport:vp}).promise;

    const tc=await page.getTextContent(); let chars=0; const ws=[];
    for(const it of tc.items){ const s=(it.str||"").trim(); if(!s) continue; chars+=s.length;
      const [x,y]=vp.convertToViewportPoint(it.transform[4], it.transform[5]); const h=Math.hypot(it.transform[2],it.transform[3])*2||20; const w=(it.width||s.length*6)*2;

    if(chars>150 && !/[�]/.test(ws.map(w=>w.text).join(""))) words=ws;
  } else {
    const bmp=await createImageBitmap(p.file); const k=Math.min(1, 2400/Math.max(bmp.width,bmp.height));
    canvas.width=Math.round(bmp.width*k); canvas.height=Math.round(bmp.height*k); ctx.drawImage(bmp,0,0,canvas.width,canvas.height);

}
/* ECI rolls print elector boxes in three columns. Each box starts with a line holding the serial number and the EPIC number.

function groupBoxes(words, W, H){
  const isEpicLine = ln => RE.epic.test(ln.toUpperCase());
  const bottom=H*0.965;
  const body=words.filter(w=>(w.y0+w.y1)/2<bottom);
  // header = everything above the first EPIC word on the page
  let firstY=Infinity;
  for(const w of body){ if(RE.epic.test(w.text.toUpperCase())) firstY=Math.min(firstY, w.y0); }
  const headerLines=wordsToLines(body.filter(w=>w.y1<firstY-2));

    const col=body.filter(w=>{ const x=(w.x0+w.x1)/2; return x>=W*k/3 && x<W*(k+1)/3 && w.y1>=firstY-2; });
    let cur=null, row=0;
    for(const ln of wordsToLines(col)){
      if(isEpicLine(ln)){ if(cur && cur.some(l=>RE.name.test(l))) boxes.push(cur); cur=[ln]; cur.col=k; cur.row=row++; }
      else if(cur) cur.push(ln);
    }
    if(cur && cur.some(l=>RE.name.test(l))) boxes.push(cur);
  }
  return {boxes, headerLines};
}
function wordsToLines(ws){
  if(!ws.length) return [];
  ws=ws.slice().sort((a,b)=>(a.y0+a.y1)/2-(b.y0+b.y1)/2);
  const avgH=ws.reduce((s,w)=>s+(w.y1-w.y0),0)/ws.length || 10;
  const lines=[]; let cur=[ws[0]], cy=(ws[0].y0+ws[0].y1)/2;
  for(const w of ws.slice(1)){ const y=(w.y0+w.y1)/2; if(Math.abs(y-cy)>avgH*0.6){ lines.push(cur); cur=[w]; cy=y; } else cur.push(w); }
  lines.push(cur);
  return lines.map(l=>l.sort((a,b)=>a.x0-b.x0).map(w=>w.text).join(" ").replace(/\s+/g," ").trim()).filter(Boolean);
}
function fixEpic(raw){
  let s=String(raw||"").toUpperCase().replace(/\s/g,"");
  if(/^[A-Z0-9]{3}\d{7}$/.test(s) || /^[A-Z0-9]{3}[0-9OISBZ]{7}$/.test(s)){
    const a=s.slice(0,3).replace(/0/g,"O").replace(/1/g,"I").replace(/5/g,"S").replace(/8/g,"B").replace(/2/g,"Z");
    const b=s.slice(3).replace(/O/g,"0").replace(/[IL]/g,"1").replace(/S/g,"5").replace(/B/g,"8").replace(/Z/g,"2");
    return a+b;
  }

}
const RE = {

  rel:/(father|husband|mother|other'?s?|తండ్రి|భర్త|తల్లి|ఇతరుల|पिता|पति|माता)/i,
  name:/(name|పేరు|नाम)/i,
  house:/(house|ఇంటి|ఇల్లు|గృహ|मकान)/i,
  age:/(age|వయస్సు|వయసు|आयु|उम्र)/i,
  gender:/(gender|sex|లింగ|लिंग)/i,

function after(line, re){ const m=line.split(/[:：;]/); if(m.length>1) return m.slice(1).join(":").trim(); return line.replace(re,"").replace(/^[\s'’s\-.]+/i,"").trim(); }

function parseHeader(lines, hdr){

/* Find each elector box from its long top and bottom border lines (ECI layout: 3 boxes per row). */
function detectBoxes(canvas){
  const W=canvas.width, H=canvas.height;
  const d=canvas.getContext("2d",{willReadFrequently:true}).getImageData(0,0,W,H).data;
  const minLen=W*0.2, segs=[];
  for(let y=0;y<H;y++){
    let x=0, base=y*W*4;
    while(x<W){
      const i=base+x*4;
      if(d[i]+d[i+1]+d[i+2]<501){ const s=x; while(x<W){ const j=base+x*4; if(d[j]+d[j+1]+d[j+2]>=501) break; x++; } if(x-s>minLen) segs.push([s,x,y]); }
      else x++;
    }
  }
  const groups=[];
  for(const [x0,x1,y] of segs){
    let g=groups.find(g=>Math.abs(g.x0-x0)<15 && Math.abs(g.x1-x1)<15);
    if(!g){ g={x0,x1,ys:[]}; groups.push(g); }
    g.ys.push(y);
  }
  const boxes=[];
  for(const g of groups){
    const lines=[]; let cur=null;
    for(const y of g.ys.sort((a,b)=>a-b)){ if(cur && y-cur[cur.length-1]<=3) cur.push(y); else { cur=[y]; lines.push(cur); } }
    const ls=lines.map(l=>l.reduce((a,b)=>a+b,0)/l.length);
    for(let i=0;i<ls.length-1;){
      const gp=ls[i+1]-ls[i];
      if(gp>H*0.03 && gp<H*0.2){ boxes.push({x0:g.x0,y0:ls[i],x1:g.x1,y1:ls[i+1]}); i+=2; } else i++;
    }
  }
  boxes.sort((a,b)=>Math.round(a.y0/20)-Math.round(b.y0/20) || a.x0-b.x0);
  return boxes;
}
function cropCanvas(src, x, y, w, h){

}
let ocrPsm=null;

    if(ei>0){ const [e]=boxLines.splice(ei,1); boxLines.unshift(e); }
    if(ei<0) boxLines.unshift("·");

}
async function startJob(job){
  job.lang = lsGet("bloreg:lang") || "tel+eng";
  if(/(^|[-_ .])ENG([-_ .]|$)/i.test(job.source)) job.lang="eng";
  else if(/(^|[-_ .])TEL([-_ .]|$)/i.test(job.source)) job.lang="tel+eng";
  job.rows=[]; job.header={}; job.done=0; job.failed=[]; job.skipped=0; job.running=true; job.stop=false; job.started=Date.now(); job.ocrPages=0;
  importJob=job; tab="import"; render();
  let wake=null; try{ wake=await navigator.wakeLock.request("screen"); }catch(e){}
  for(const p of job.pages){
    if(job.stop) break;
    try{
      const {recs, how}=await analysePage(job,p);
      if(how==="ocr") job.ocrPages++;
      for(const r of recs){ if(r.deleted){ job.skipped++; continue; } const row=mkRow(r); row.page=p.n; row.raw=r.raw; row.anchor=r.anchor; job.rows.push(row); }
    }catch(e){ job.failed.push(p.n); job.lastErr=e && e.message; }
    job.done++; job.note=""; drawJob($("#view"));
  }
  try{ wake && wake.release(); }catch(e){}
  fillSerials(job.rows);
  job.running=false;
  staging={ rows:job.rows, source:job.source, header:job.header, skipped:job.skipped, failed:job.failed, job, ocr:job.ocrPages>0 };
  importJob=null; render();
}
/* a serial number the scan missed is the one between its neighbours */
function fillSerials(rows){
  // serials run 1,2,3… through the whole part, so each box follows the one before it.
  // a serial read from the page is trusted only where it fits that order.
  for(let i=0;i<rows.length;i++){
    const prev=i>0?+rows[i-1].sl:0, mine=+rows[i].sl||0;
    if(!prev){ if(!mine){ const next=i<rows.length-1?+rows[i+1].sl:0; rows[i].sl=next>1?String(next-1):"1"; } continue; }
    if(mine && mine>prev && mine<=prev+3 && (rows[i].anchor || i===rows.length-1 || !(+rows[i+1].sl) || +rows[i+1].sl===mine+1)) continue;
    rows[i].sl=String(prev+1);
  }
}
function drawJob(el){

const CMP = [["name","name"],["relName","relation name"],["house","house no."],["gender","gender"],["sec","section"],["relType","relation"]];
function diffRoll(){
  const cur=state.voters.filter(v=>!v.gone && v.src!=="manual");
  const curMap=new Map(cur.filter(v=>v.epic).map(v=>[v.epic,v]));
  const inc=staging.rows, inMap=new Map(inc.filter(r=>r.epic).map(r=>[r.epic,r]));
  const added=[], changed=[];
  for(const r of inc){
    const old=r.epic&&curMap.get(r.epic);
    if(!old){ added.push(r); continue; }
    const diffs=[];
    for(const [k,l] of CMP){ if(String(r[k]||"").trim() && String(r[k]||"").trim()!==String(old[k]||"").trim()) diffs.push(l+": "+(old[k]||"—")+" → "+r[k]); }
    if(r.age && old.age && Math.abs(+r.age-+old.age)>1) diffs.push("age: "+old.age+" → "+r.age);
    if(r.photo && old.photo && r.photo!==old.photo) diffs.push("photo: "+(old.photo==="yes"?"available":"not available")+" → "+(r.photo==="yes"?"available":"not available"));
    if(diffs.length) changed.push({r,old,diffs});
  }
  const removed=[...curMap.values()].filter(v=>!inMap.has(v.epic));
  const photoAdded=inc.filter(r=>r.photo==="yes" && r.epic && curMap.get(r.epic) && curMap.get(r.epic).photo==="no");
  const manualFound=state.voters.filter(v=>v.src==="manual"&&!v.gone&&v.epic&&inMap.has(v.epic));
  return {added,removed,changed,manualFound,photoAdded,noEpic:inc.filter(r=>!r.epic).length};
}

  $("#goImp").onclick=()=>{tab="import";render();};
  if($("#undoRev")) $("#undoRev").onclick=()=>{ pushUndo("undo revision"); const d=JSON.parse(lastPrevRoll); state.meta=d.meta; state.voters=d.voters; lastPrevRoll=null; commit("undo",null,"Undid last revision"); render(); toast("Revision undone"); };
}
function applyRevision(){
  const d=staging.diff, rev=state.meta.rev+1;
  if(!staging.fromList) keepStagingAsList();
  lastPrevRoll=JSON.stringify({meta:state.meta,voters:state.voters});
  pushUndo("revision "+rev);
  const byEpic=new Map(state.voters.filter(v=>v.epic&&!v.gone).map(v=>[v.epic,v]));
  const chg=new Map(d.changed.map(c=>[c.r.epic,c.diffs.join("; ")]));
  const inRoll=new Set(staging.rows.map(r=>r.epic).filter(Boolean));
  const next=[];
  for(const r of staging.rows){
    const old=r.epic&&byEpic.get(r.epic), nv=rowToVoter(r,rev);
    if(old){
      nv.id=old.id; nv.st=Object.assign(defSt(),old.st); if(r.ph&&!nv.st.ph) nv.st.ph=r.ph;
      nv.addedRev=old.addedRev; nv.newIn=old.newIn;
      if(old.src==="manual" && nv.st.form==="Form 6") nv.st.formSt="Approved";
      if(old.corr && old.corr.length){ nv.corr=old.corr; nv.corrBy=old.corrBy; nv.orig=old.orig; nv.corrDone=old.corrDone||0;
        if(!nv.corrDone){ const keys=EDIT_FIELDS.map(([k])=>k).filter(k=>old.orig && String(old.orig[k]||"")!==String(old[k]||"")); if(keys.length && keys.every(k=>String(r[k]||"").trim().toLowerCase()===String(old[k]||"").trim().toLowerCase())) nv.corrDone=rev; } }
      if(old.photo==="no" && nv.photo==="yes") nv.photoIn=rev; else if(old.photoIn) nv.photoIn=old.photoIn;
      if(!nv.photo && old.photo) nv.photo=old.photo;
      if(chg.has(r.epic)){ nv.chgIn=rev; nv.changes=chg.get(r.epic); } else if(old.changes) nv.changes=old.changes;
      byEpic.delete(r.epic);
    } else nv.newIn=rev;
    next.push(nv);
  }
  const carry=[];
  for(const v of state.voters){
    if(v.gone){ carry.push(v); continue; }
    if(v.src==="manual"){ if(!(v.epic && inRoll.has(v.epic))) carry.push(v); continue; }
    if(!v.epic || byEpic.has(v.epic)) carry.push(Object.assign({},v,{gone:true,goneRev:rev}));
  }
  state.voters=fixIds(next.sort((a,b)=>(+a.sl||1e9)-(+b.sl||1e9)).concat(carry));
  state.meta.rev=rev;
  state.meta.revisions.unshift({n:rev,t:Date.now(),source:staging.source,total:next.length,added:d.added.length,removed:d.removed.length,changed:d.changed.length});
  commit("revision",null,`Applied revision ${rev}: +${d.added.length} new, −${d.removed.length} removed, ${d.changed.length} corrected`);
  staging=null; render(); toast("Revision "+rev+" applied");
}

  if(AP.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(AP.map(a=>{ const dd=appDocs(a); return {"Type":(APP_TYPES[a.type]||{}).short,"Name":a.name,"Relation":a.relType,"Father/Husband":a.relName,"Gender":a.gender,"Date of birth":a.dob,"House no":a.house,"Phone":a.phone,"Family EPIC":a.familyEpic||"","Voter EPIC":a.voterEpic||a.epic||"","Ref no":a.refNo||"","Documents":dd.done+"/"+dd.need.length,"Stage":stageLabel(a.stage),"Received":fmtDate(a.created),"Note":a.note}; })), "Applications");
  const AL=(m.asdList&&m.asdList.rows)||[];
  if(AL.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(AL.map(r=>{ const v=asdMatch(r); return {"Serial":r.sl,"EPIC":r.epic,"Name":r.name,"Relation name":r.relName,"House no":r.house,"ASD category":r.cat,"Remarks":r.remarks,"Linked voter serial":v?v.sl:"Not in roll"}; })), "ASD list");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{AC:m.ac,"AC name":m.acName,Part:m.part,"Part name":m.partName,BLO:m.blo,Revision:m.rev,"Exported":new Date().toLocaleString("en-IN")}]), "Part");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(chunkStr(JSON.stringify({app:"blo-register-1",meta:state.meta,voters:state.voters}),30000).map(s=>[s])), "_restore");
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const name=`BLO_AC${m.ac||"x"}_Part${m.part||"x"}_${new Date().toISOString().slice(0,10)}.xlsx`;
  if(saveFile(name, new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))){
    state.meta.lastBackup=Date.now(); commit("backup",-1,"Downloaded Excel backup"); toast("Backup downloaded"); if(tab==="backup"||tab==="home") render(); }
}
function restoreFile(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      let data;
      if(file.name.toLowerCase().endsWith(".json")) data=JSON.parse(new TextDecoder().decode(r.result));
      else { const wb=XLSX.read(new Uint8Array(r.result),{type:"array"}); const sh=wb.Sheets["_restore"]; if(!sh) throw 0; data=JSON.parse(XLSX.utils.sheet_to_json(sh,{header:1}).map(x=>x[0]).join("")); }
      if(!data||data.app!=="blo-register-1"||!Array.isArray(data.voters)) throw 0;
      confirmBox(`Restore ${data.voters.length} voters from this backup? Your current list (${state.voters.length}) will be replaced. You can undo right after.`, "Restore", ()=>{
        pushUndo("restore backup"); state.meta=Object.assign(blank().meta,data.meta); state.voters=data.voters; commit("restore",null,"Restored backup: "+file.name); render(); toast("Backup restored"); });
    }catch(e){ toast("That file isn't a backup from this app"); }
  };
  r.readAsArrayBuffer(file);
}
function confirmBox(text, okLabel, fn, danger){
  $("#sheetRoot").innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true"><p style="margin:0">${esc(text)}</p><div class="row"><button class="btn ${danger?"danger":"primary"}" id="cOk">${esc(okLabel)}</button><button class="btn" id="cNo">Cancel</button></div></div></div>`;
  $("#cOk").onclick=()=>{ closeSheet(); fn(); }; $("#cNo").onclick=closeSheet;
}
function renderBackup(el){
  const m=state.meta, signed=session&&session.token;
  el.innerHTML=`<div class="panel">
    <h2>Account and backup</h2>
    ${whereText()}
    ${signed?`<div class="card panel"><h3>Your account</h3>
        <div class="small"><span class="muted">Signed in as</span> <span class="mono">${esc(session.email)}</span><br><span class="muted">Last saved to account:</span> ${fmtDate(state.cloudSavedAt)}</div>
        <div class="row"><button class="btn" id="rl">Reload from my account</button><button class="btn" id="chp">Change password</button><button class="btn danger" id="so">Sign out</button></div>
        <p class="muted small" style="margin:0">Used this account on another phone? Tap Reload to bring those changes here.</p></div>`
      :`<div class="card panel"><h3>Create a free account</h3><p class="muted small" style="margin:0">Save your list to your own account so it is safe even if this phone is lost. Your current voters will be uploaded to the new account.</p><button class="btn primary" id="toAuth">Sign in or create account</button></div>`}
    <div class="card panel">
      <h3>Excel backup</h3>
      <p class="muted small" style="margin:0">One file with every voter and all your marks. Open it in Excel or Google Sheets, or restore the app from it on any phone. Last backup: <strong>${fmtDate(m.lastBackup)}</strong>.</p>
      <button class="btn primary" id="xl" ${state.voters.length?"":"disabled"}>Download Excel backup</button>
    </div>
    <div class="card panel">
      <h3>Restore from a backup</h3>
      <p class="muted small" style="margin:0">Choose an Excel backup made by this app.</p>
      <label class="btn" for="rf" style="text-align:center">Choose backup file</label><input type="file" id="rf" accept=".xlsx,.json" hidden>
    </div>
    ${undoStack.length?`<button class="btn" id="undoBtn">Undo: ${esc(undoStack[undoStack.length-1].label)}</button>`:""}
    <div class="card panel">
      <h3>Start fresh</h3>
      <p class="muted small" style="margin:0">Clears every voter (for example, to remove example data). Download a backup first if this is real data.</p>
      <button class="btn danger" id="wipe" ${state.voters.length?"":"disabled"}>Clear all voters</button>
    </div>
  </div>`;
  $("#xl").onclick=exportExcel;
  $("#rf").onchange=e=>{ if(e.target.files[0]) restoreFile(e.target.files[0]); };
  if($("#rl")) $("#rl").onclick=async()=>{ cloud.ready=false; state.savedAt=0; await connectAccount(); toast("Reloaded from your account"); };
  if($("#so")) $("#so").onclick=()=>confirmBox("Sign out on this phone? Your list stays safe in your account.", "Sign out", signOut);
  if($("#chp")) $("#chp").onclick=changePassword;
  if($("#toAuth")) $("#toAuth").onclick=()=>{ lsSet("bloreg:pending-upload", state); session=null; lsSet("bloreg:session",null); showAuth("signup"); };
  if($("#undoBtn")) $("#undoBtn").onclick=undo;
  $("#wipe").onclick=()=>confirmBox(`Clear all ${state.voters.length} voters? Download an Excel backup first if this is real data.`, "Yes, continue", ()=>setTimeout(()=>confirmBox(`Please confirm again: delete all ${state.voters.length} voters and their marks from this app?`, "Clear all voters", ()=>{ pushUndo("clear all"); const k=state.meta; state.voters=[]; state.meta=Object.assign(blank().meta,{ac:k.ac,acName:k.acName,part:k.part,partName:k.partName,blo:k.blo,activity:k.activity,lastBackup:k.lastBackup,asdList:k.asdList,mode:k.mode,lists:k.lists,apps:k.apps}); commit("wipe",null,"Cleared all voters"); render(); toast("Cleared — use Undo if this was a mistake"); }, true),50), true);
}
function changePassword(){
  $("#sheetRoot").innerHTML=`<div class="sheet-bg" id="sbg"><form class="sheet" id="cpf"><h2>Change password</h2>
    <label class="f">Current password<input id="op" type="password" autocomplete="current-password"></label>
    <label class="f">New password<input id="np" type="password" autocomplete="new-password"></label>
    <div class="err" id="cpe"></div><div class="row"><button class="btn primary" type="submit">Change</button><button class="btn" type="button" id="cpx">Cancel</button></div></form></div>`;
  $("#cpx").onclick=closeSheet;
  $("#cpf").onsubmit=async e=>{ e.preventDefault(); try{ await rpc("blo_change_password",{p_token:session.token,p_old:$("#op").value,p_new:$("#np").value}); closeSheet(); toast("Password changed"); }catch(ex){ $("#cpe").textContent=ex.message; } };
}

/* ================= install as phone app ================= */
let installPrompt=null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installPrompt=e; refreshInstall(); });
window.addEventListener("appinstalled", ()=>{ installPrompt=null; toast("Installed. Open it from your home screen."); refreshInstall(); });
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
function installCard(){
  if(isStandalone()) return "";
  if(installPrompt) return `<div class="card panel" id="installCard"><h3>Install on this phone</h3><p class="muted small" style="margin:0">Add BLO Register to your home screen. It opens like a normal app, works without internet, and your data stays the same.</p><button class="btn primary" id="installBtn">Install app</button></div>`;
  if(isIOS()) return `<div class="card panel" id="installCard"><h3>Install on this iPhone</h3><p class="muted small" style="margin:0">In Safari, tap the Share button, then <strong>Add to Home Screen</strong>.</p></div>`;
  return `<div class="card panel" id="installCard"><h3>Install on this phone</h3><p class="muted small" style="margin:0">In Chrome, tap the ⋮ menu at the top right, then <strong>Install app</strong> or <strong>Add to Home screen</strong>.</p></div>`;
}
function bindInstall(){ const b=$("#installBtn"); if(b) b.onclick=async()=>{ if(!installPrompt) return; installPrompt.prompt(); try{ await installPrompt.userChoice; }catch(e){} installPrompt=null; refreshInstall(); }; }
function refreshInstall(){ const c=$("#installCard"); if(!c) return; const t=document.createElement("div"); t.innerHTML=installCard(); if(t.firstElementChild) c.replaceWith(t.firstElementChild); else c.remove(); bindInstall(); }
if("serviceWorker" in navigator){ window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }

/* ================= start ================= */
(function start(){
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(()=>{}); }catch(e){}
  session=lsGet("bloreg:session");
  if(session) startData(); else showAuth();
})();
</script>
